<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="YouTube Summarizer">
  <title>YouTube Summarizer</title>
  <!--
    A VHS cassette: light shell, two reels, and a red label band.
    Used at 32, 48 and 128 px. A separate simplified mark covers 16 px.
  -->
  <rect x="4" y="30" width="120" height="68" rx="7" fill="#E9EEF5" stroke="#232A36" stroke-width="4"/>
  <rect x="4" y="86" width="120" height="12" rx="7" fill="#E62117"/>
  <rect x="4" y="86" width="120" height="8" fill="#E62117"/>
  <g fill="#232A36">
    <circle cx="38" cy="62" r="18"/>
    <circle cx="90" cy="62" r="18"/>
  </g>
  <g fill="#E9EEF5">
    <circle cx="38" cy="62" r="6"/>
    <circle cx="90" cy="62" r="6"/>
  </g>
</svg>
