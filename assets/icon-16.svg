<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="YouTube Summarizer">
  <title>YouTube Summarizer</title>
  <!--
    Drawn on a 16-unit grid so every edge lands on a pixel boundary: a scaled-down
    detailed mark turns to mush at this size. Reels are solid; holes would vanish.
  -->
  <rect x="0" y="3" width="16" height="10" rx="1.5" fill="#E9EEF5"/>
  <rect x="0" y="10.5" width="16" height="2.5" fill="#E62117"/>
  <circle cx="4.5" cy="7" r="2.2" fill="#232A36"/>
  <circle cx="11.5" cy="7" r="2.2" fill="#232A36"/>
</svg>
